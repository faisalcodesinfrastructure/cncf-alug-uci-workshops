name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and shellcheck
        run: |
          find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find . -name '*.sh' -print0 | xargs -0 shellcheck
      - name: No Windows line endings in scripts or docs
        run: |
          if grep -rIl $'\r' --include='*.sh' --include='*.md' --include='*.yaml' .; then
            echo "CRLF line endings found in the files above"; exit 1
          fi

  e2e-linux:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Session 1 end to end
        run: bash scripts/e2e-session01.sh
